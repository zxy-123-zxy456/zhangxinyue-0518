<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!-- 类 实例就是对象，两个要素 属性和方法
     学生属性：学号、姓名、性别、年龄、班级
     方法：学习、睡觉、看电影、玩游戏-->
</head>
<body>
    <script>
        //创建对象
        var student={
            name:"张三",
            sex:"男",
            age:18,
            class:"高一1班",
            hobby:['看电影','游戏']
            study:function(){
                console.log("学习");
            },
            sleep:function(){
                console.log("睡觉");
            },
            watchMovie:function(){
                console.log("看电影");
            },
            playGame:function(){
                console.log("玩游戏");
            }
        var student={
                watchMovie:function(){
                    console.log("看电影");

                },
                console.log(student.name);
                console.log(student.study());
                // 删除对象方法
                delete student.watchMovie;
                console.log('watchMovie' in student);
            }
        }
        //对象的遍历
        for(var key in student){
            console.log(key+":"+student[key]);
        }
        var o=student;
        console .log(o.name);
        // 对象引用类型（引用的地址）
        console.log('o的名字'+o.name);
        console.log('student的名字'+student.name);
        </script>

    
</body>
</html>
