<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="http://at.alicdn.com/t/c/font_5232001_5h0oqi1ih12.js"></script>
 <link rel="stylesheet" href="./css/svg.005.css">
 <style>
    .icon{
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        fill:currentColor;
        overflow: hidden;
    }
 </style>
</head>
<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-shouyechangguishouye"></use>
</svg>
 <!--div.budge-dot回车-->
            <!--红点-->
            <div class="budge-dot" id="budge-home"></div>
<span>首页</span>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-shu"></use>
</svg>
<span>计划</span>
<div class="budge-num" id="budge-plan">6</div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-aixin"></use>
</svg>
<span>收藏</span>
<div class="budge-border" id="budge-collect"></div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
  <use xlink:href="#icon-shouji"></use>
</svg>
<span>我的</span>
<div class="budge-dot max" id="budge-my">100+</div>
        </div>

    </div>
<script>
    //写一个函数，当我点击当天的item时候，颜色发生变化
    function changeTab(current){
let tabs = document.querySelectorAll(".tab-item");
for(let i=0;i<tabs.length;i++) {
    tabs il.classList.remove('active');
}
current.classList.add("active");}

</script>
</body>
</html>
