<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端关键：禁止缩放，固定宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bottom Nav — iconfont</title>

    <!-- iconfont 字体图标（本地 font 目录） -->
    <link rel="stylesheet" href="font/iconfont.css">

    <style>
        /* ============================================
           iconfont-3.html — 移动端底部导航（字体图标）
           设计语言：延续 iconfont-1/2 的近黑底 + 琥珀金
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #141418;
            color: #EBE7DE;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 70px;          /* 给底部导航留空间 */
        }

        /* ---------- 顶部导航：返回首页 ---------- */
        .zxy_topNav {
            width: 100%;
            max-width: 480px;
            height: 44px;
            border-bottom: 1px solid #2A2A2E;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background-color: #141418;
        }

        .zxy_topNav a.zxy_back {
            color: #6B6B72;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }

        .zxy_topNav a.zxy_back:hover { color: #C9A961; }

        .zxy_topNav .zxy_pageTitle {
            flex: 1;
            text-align: center;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #C9A961;
            font-weight: 500;
        }

        /* ---------- 手机屏幕模拟容器 ---------- */
        .zxy_phoneWrap {
            width: 100%;
            max-width: 480px;
            flex: 1;
            position: relative;
            border-left: 1px solid #2A2A2E;
            border-right: 1px solid #2A2A2E;
            background-color: #1A1A1E;
            min-height: calc(100vh - 44px - 70px);
        }

        /* ---------- 模拟页面内容（占位） ---------- */
        .zxy_contentArea {
            padding: 24px 20px;
        }

        .zxy_contentArea h2 {
            font-size: 22px;
            font-weight: 500;
            color: #EBE7DE;
            margin-bottom: 8px;
        }

        .zxy_contentArea p {
            font-size: 14px;
            color: #6B6B72;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        /* ---------- 4 个示例卡片 ---------- */
        .zxy_cardGrid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .zxy_demoCard {
            aspect-ratio: 1 / 1.3;
            border: 1px solid #2A2A2E;
            background-color: #0C0C0E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .zxy_demoCard i.iconfont {
            font-size: 28px;
            color: #C9A961;
        }

        .zxy_demoCard span {
            font-family: "JetBrains Mono", "Consolas", monospace;
            font-size: 10px;
            color: #6B6B72;
        }

        /* ============================================
           底部导航（核心）
           ============================================ */
        .zxy_bottomNav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 64px;
            background-color: #0C0C0E;
            border-top: 1px solid #2A2A2E;
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            padding-bottom: env(safe-area-inset-bottom); /* iOS 安全区 */
            z-index: 100;
        }

        .zxy_navItem {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            user-select: none;
            transition: color 0.2s;
        }

        /* 图标容器（相对定位，徽章挂右上角） */
        .zxy_iconWrap {
            position: relative;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zxy_iconWrap i.iconfont {
            font-size: 22px;
            color: #6B6B72;
            transition: color 0.2s;
        }

        .zxy_navItem.active .zxy_iconWrap i.iconfont {
            color: #C9A961;
        }

        .zxy_navItem .zxy_label {
            font-size: 10px;
            color: #6B6B72;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .zxy_navItem.active .zxy_label {
            color: #C9A961;
        }

        /* ---------- 数字徽章（右上角） ---------- */
        .zxy_badge {
            position: absolute;
            top: -2px;
            right: -8px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background-color: #D9534F;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            border-radius: 9px;           /* 胶囊形 */
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            border: 1px solid #0C0C0E;    /* 描边避免被背景吞没 */
            box-sizing: border-box;
        }

        /* 超过 99 显示 99+ */
        .zxy_badge.zxy_badgeLarge {
            min-width: 24px;
            padding: 0 6px;
            font-size: 9px;
        }

        /* ---------- 纯红点（无数字） ---------- */
        .zxy_dot {
            position: absolute;
            top: 2px;
            right: 4px;
            width: 8px;
            height: 8px;
            background-color: #D9534F;
            border-radius: 50%;
            border: 1px solid #0C0C0E;
            box-sizing: border-box;
        }

        /* ---------- 选中态下划线 ---------- */
        .zxy_navItem.active::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 2px;
            background-color: #C9A961;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="zxy_topNav">
        <a href="index.html" class="zxy_back">← Index</a>
        <span class="zxy_pageTitle">Bottom Nav · iconfont</span>
        <span style="width:42px"></span>
    </div>

    <!-- 手机屏幕模拟容器 -->
    <div class="zxy_phoneWrap">

        <div class="zxy_contentArea">
            <h2>字体图标版</h2>
            <p>4 个底部导航项，来自本地 iconfont 字体库。分别演示：数字徽章、纯红点、空状态。</p>

            <div class="zxy_cardGrid">
                <div class="zxy_demoCard"><i class="iconfont icon-shouyechangguishouye"></i><span>首页</span></div>
                <div class="zxy_demoCard"><i class="iconfont icon-shouji"></i><span>手机</span></div>
                <div class="zxy_demoCard"><i class="iconfont icon-shu"></i><span>书</span></div>
                <div class="zxy_demoCard"><i class="iconfont icon-aixin"></i><span>爱心</span></div>
            </div>
        </div>

        <!-- 底部导航栏（核心） -->
        <nav class="zxy_bottomNav">

            <!-- ① 首页 —— 有数字徽章（12） -->
            <a class="zxy_navItem active" data-target="home">
                <div class="zxy_iconWrap">
                    <i class="iconfont icon-shouyechangguishouye"></i>
                    <span class="zxy_badge">12</span>
                </div>
                <span class="zxy_label">首页</span>
            </a>

            <!-- ② 消息 —— 有纯红点（无数字） -->
            <a class="zxy_navItem" data-target="message">
                <div class="zxy_iconWrap">
                    <i class="iconfont icon-shouji"></i>
                    <span class="zxy_dot"></span>
                </div>
                <span class="zxy_label">消息</span>
            </a>

            <!-- ③ 发现 —— 无徽章无红点 -->
            <a class="zxy_navItem" data-target="discover">
                <div class="zxy_iconWrap">
                    <i class="iconfont icon-shu"></i>
                </div>
                <span class="zxy_label">发现</span>
            </a>

            <!-- ④ 我的 —— 有 99+ 大数字徽章 -->
            <a class="zxy_navItem" data-target="me">
                <div class="zxy_iconWrap">
                    <i class="iconfont icon-aixin"></i>
                    <span class="zxy_badge zxy_badgeLarge">99+</span>
                </div>
                <span class="zxy_label">我的</span>
            </a>

        </nav>

    </div>

    <script>
        // 点击切换 active 状态（同时徽章/红点仍保留）
        const items = document.querySelectorAll('.zxy_navItem');
        items.forEach(item => {
            item.addEventListener('click', function () {
                items.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>

</body>
</html>
