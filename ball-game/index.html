<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页抓小球小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="zxy_body">

    <!-- 游戏容器：居中 800×600 -->
    <div id="zxy_gameContainer" class="zxy_gameContainer">

        <!-- 顶部信息栏 -->
        <div id="zxy_topBar" class="zxy_topBar">
            <!-- 左侧：分数 -->
            <div id="zxy_scoreBox" class="zxy_scoreBox">
                分数：<span id="zxy_scoreValue">0</span>
            </div>
            <!-- 右侧：倒计时 -->
            <div id="zxy_timerBox" class="zxy_timerBox">
                倒计时：<span id="zxy_timerValue">2:00</span>
            </div>
        </div>

        <!-- 游戏活动区（小球生成区域） -->
        <div id="zxy_playArea" class="zxy_playArea">

            <!-- 开始按钮（初始可见） -->
            <button id="zxy_startBtn" class="zxy_startBtn">开始游戏</button>

            <!-- 3-2-1-Go! 倒计时显示层（初始隐藏） -->
            <div id="zxy_countdownOverlay" class="zxy_countdownOverlay"></div>

            <!-- 结束界面层（初始隐藏） -->
            <div id="zxy_endOverlay" class="zxy_endOverlay">
                <div class="zxy_endContent">
                    <h2 id="zxy_endTitle">时间到！</h2>
                    <p>最终得分：<span id="zxy_finalScore">0</span></p>
                    <button id="zxy_restartBtn" class="zxy_restartBtn">再来一局</button>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
